[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/graph",
    "crates/sybil",
    "crates/reputation",
    "crates/wot",
    "crates/did",
    "crates/nullifier",
    "crates/zk",
    "crates/api",
    "crates/sdk",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/sybil-resistentes/proof-of-personhood"
description = "A decentralized identity system proving unique personhood through social graph topology analysis, web-of-trust vouching, and zk-SNARK privacy-preserving proofs."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
ed25519-dalek = "2"
ed25519 = "2.2"
blake3 = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
petgraph = "0.6"
rayon = "1"
csv = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
axum = "0.7"
tonic = "0.12"
prost = "0.13"
chrono = { version = "0.4", features = ["serde"] }