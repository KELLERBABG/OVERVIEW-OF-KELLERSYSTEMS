openapi: "3.0.3"
info:
  title: Sybil-Resistentes API
  version: "0.1.0"
  description: REST API for the Sybil-Resistentes Proof-of-Personhood system
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
                  version: { type: string }
  /api/v1/nodes:
    get:
      summary: List all nodes
      operationId: listNodes
      responses:
        "200":
          description: List of nodes
    post:
      summary: Create a new node
      operationId: createNode
      responses:
        "201":
          description: Node created
  /api/v1/graph/analyze:
    post:
      summary: Analyze graph topology
      operationId: analyzeGraph
      responses:
        "200":
          description: Graph analysis results
  /api/v1/wot/vouch:
    post:
      summary: Issue a vouch
      operationId: issueVouch
      responses:
        "201":
          description: Vouch issued
  /api/v1/sybil/detect:
    post:
      summary: Run Sybil detection
      operationId: detectSybil
      responses:
        "200":
          description: Detection results
  /api/v1/reputation/{nodeId}:
    get:
      summary: Get reputation score for a node
      operationId: getReputation
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reputation score
  /api/v1/did:
    post:
      summary: Create a new DID
      operationId: createDid
      responses:
        "201":
          description: DID created
    get:
      summary: Resolve a DID
      operationId: resolveDid
      parameters:
        - name: did
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DID document
  /api/v1/nullifier:
    post:
      summary: Register a nullifier
      operationId: registerNullifier
      responses:
        "200":
          description: Nullifier registered