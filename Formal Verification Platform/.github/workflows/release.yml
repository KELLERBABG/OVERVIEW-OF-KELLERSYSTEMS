name: release

# Tagged binaries with checksums (ROADMAP M1).
#
# The archive is not a statically linked executable: this verifier reads MIR
# through `rustc_private`, so it is linked against one exact nightly and loads
# that toolchain's driver libraries at run time. A release therefore bundles the
# executable, the Z3 library it was built against, and a launcher that resolves
# the pinned toolchain through rustup. The target machine still needs the pinned
# Rust toolchain; see docs/RELEASE.md.
#
# This workflow has not been observed running from the development checkout that
# wrote it. Treat the first dispatch as the test, and fix the matrix there rather
# than assuming these runner images match the local Windows/Git-Bash setup.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  Z3_VERSION: '4.16.0'

jobs:
  package:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            z3_glob: '*x64-glibc*.zip'
            packager: bash scripts/package-release.sh
          - os: windows-2022
            target: x86_64-pc-windows-gnu
            z3_glob: '*x64-win.zip'
            packager: pwsh -NoProfile -File scripts/package-release.ps1
          - os: macos-13
            target: x86_64-apple-darwin
            z3_glob: '*x64-osx*.zip'
            packager: bash scripts/package-release.sh

    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          CHANNEL=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -n1)
          [[ -n "$CHANNEL" ]] || { echo "no channel in rust-toolchain.toml" >&2; exit 1; }
          # Name the host triple explicitly: the Windows image's default host is
          # MSVC, while this project pins the GNU toolchain, and a release archive
          # must contain the compiler it claims to.
          TOOLCHAIN="${CHANNEL}-${{ matrix.target }}"
          rustup toolchain install "$TOOLCHAIN" --profile minimal \
            --component rustc-dev --component llvm-tools-preview
          rustup default "$TOOLCHAIN"
          # `rust-toolchain.toml` names the bare channel, and rustup resolves a
          # bare name to the default host (MSVC on Windows) even when the GNU
          # toolchain is the one just installed. The build and packager steps
          # take this value through RUSTUP_TOOLCHAIN so they use this host.
          echo "KELLER_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          rustc -vV

      # A GNU-target link needs the MinGW linker. The Windows image ships MSYS2
      # but does not put mingw64/bin on PATH; without this the GNU build can
      # fail before the packager runs. This is still an unverified workflow.
      - name: Put MinGW on PATH (Windows GNU)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [[ -d /c/msys64/mingw64/bin ]]; then
            echo 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"
          else
            echo "::warning::C:\\msys64\\mingw64\\bin is absent; the GNU link step may fail"
          fi

      # The Z3 archive is selected from the release by pattern rather than by a
      # hardcoded macOS asset name. The Linux digest is the one the installer
      # pins; the others are recorded in the bundle manifest and the release
      # checksums, which is provenance, not the same claim as a pre-pinned digest.
      - name: Fetch the pinned Z3 release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .z3-dl
          gh release download "z3-${Z3_VERSION}" --repo Z3Prover/z3 \
            --pattern '${{ matrix.z3_glob }}' --dir .z3-dl
          archive=$(find .z3-dl -maxdepth 1 -type f -name '*.zip' | head -n1)
          [[ -n "$archive" ]] || { echo "no Z3 archive matched ${{ matrix.z3_glob }}" >&2; exit 1; }
          sha256sum "$archive"
          unzip -q "$archive" -d .z3-dl/unpacked
          root=$(find .z3-dl/unpacked -maxdepth 1 -mindepth 1 -type d | head -n1)
          [[ -n "$root" ]] || { echo "Z3 archive layout not understood" >&2; exit 1; }
          mkdir -p .z3
          cp -R "$root" .z3/current
          .z3/current/bin/z3 --version || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build release binaries
        shell: bash
        run: cargo build --release --locked --bins
        env:
          RUSTUP_TOOLCHAIN: ${{ env.KELLER_TOOLCHAIN }}

      - name: Stage the archive and its checksum
        shell: bash
        run: ${{ matrix.packager }}
        env:
          KELLER_TARGET: ${{ matrix.target }}
          Z3_HOME: ${{ github.workspace }}/.z3/current
          RUSTUP_TOOLCHAIN: ${{ env.KELLER_TOOLCHAIN }}

      - name: Smoke-test the staged launcher
        shell: bash
        run: |
          set -euo pipefail
          # Run the launcher from the staged tree, before the archive is treated
          # as publishable: a bundle that cannot answer --version is not a
          # release, whatever its checksum says.
          stage=$(find dist -maxdepth 1 -mindepth 1 -type d | head -n1)
          if [[ -f "$stage/bin/keller" ]]; then
            "$stage/bin/keller" --version
          else
            "$stage/bin/keller.cmd" --version
          fi

      - name: Generate SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF' > "dist/keller-verify-${{ matrix.target }}.spdx.json"
          {
            "spdxVersion": "SPDX-2.3",
            "dataLicense": "CC0-1.0",
            "SPDXID": "SPDXRef-DOCUMENT",
            "name": "keller-verify-${{ matrix.target }}",
            "documentNamespace": "https://github.com/KELLERBABG/keller-verify/spdx/keller-verify-${{ matrix.target }}",
            "creationInfo": {
              "creators": [
                "Tool: keller-verify-pipeline",
                "Organization: Keller Systems"
              ],
              "created": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            },
            "packages": [
              {
                "SPDXID": "SPDXRef-Package-keller-verify",
                "name": "keller-verify",
                "versionInfo": "1.0.0",
                "downloadLocation": "https://github.com/KELLERBABG/keller-verify",
                "filesAnalyzed": false,
                "licenseConcluded": "MIT OR Apache-2.0"
              },
              {
                "SPDXID": "SPDXRef-Package-z3",
                "name": "z3",
                "versionInfo": "${Z3_VERSION}",
                "downloadLocation": "https://github.com/Z3Prover/z3",
                "filesAnalyzed": false,
                "licenseConcluded": "MIT"
              }
            ]
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: keller-verify-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/*.spdx.json
          if-no-files-found: error

  publish:
    name: publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      # Needed for the notes file below; the artifacts are downloaded separately.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine and verify checksums
        run: |
          set -euo pipefail
          cd dist
          : > SHA256SUMS
          for file in keller-verify-*.sha256; do
            # Windows' Set-Content writes CRLF; sha256sum treats the CR as part
            # of the file name. Normalise before combining.
            tr -d '\r' < "$file" >> SHA256SUMS
          done
          sort -k2 SHA256SUMS -o SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/*.spdx.json \
            --title "${GITHUB_REF_NAME}" \
            --notes-file docs/RELEASE.md \
            --verify-tag
