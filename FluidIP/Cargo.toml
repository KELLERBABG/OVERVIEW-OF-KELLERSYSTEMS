[workspace]
resolver = "2"
members = [
    "core",
    "crypto",
    "api",
    "cli",
    "contracts",
    "tests",
    "p2p",
    "storage",
]

[workspace.dependencies]
dfip-core = { path = "core" }
dfip-crypto = { path = "crypto" }
dfip-api = { path = "api" }
dfip-cli = { path = "cli" }
dfip-contracts = { path = "contracts" }
dfip-p2p = { path = "p2p" }
dfip-storage = { path = "storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
prost = "0.13"
prost-build = "0.13"
petgraph = "0.6"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }