<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8442c" />
      <stop offset="100%" stop-color="#e0694e" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8862c" />
      <stop offset="100%" stop-color="#e0b259" />
    </linearGradient>
    <radialGradient id="cardGlow" cx="20%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#b8442c" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#141311" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0c0b0a" stop-opacity="1" />
    </radialGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="#0c0b0a" />
  <rect width="1200" height="400" fill="url(#cardGlow)" />

  <!-- Subtle Blueprint Grid -->
  <g stroke="#d8d1c0" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Left: Shield & Inspection Lens Graphic -->
  <g transform="translate(80, 110)" filter="url(#subtleShadow)">
    <rect width="180" height="180" rx="36" fill="#181614" stroke="#38332c" stroke-width="1.5" />
    
    <!-- Outer Lens Ring -->
    <circle cx="85" cy="85" r="48" fill="none" stroke="#d8d1c0" stroke-opacity="0.25" stroke-width="2.5" />
    <!-- Reticle Marks -->
    <line x1="85" y1="28" x2="85" y2="36" stroke="#b8442c" stroke-width="2" stroke-linecap="round" />
    <line x1="85" y1="134" x2="85" y2="142" stroke="#b8442c" stroke-width="2" stroke-linecap="round" />
    <line x1="28" y1="85" x2="36" y2="85" stroke="#b8442c" stroke-width="2" stroke-linecap="round" />
    <line x1="134" y1="85" x2="142" y2="85" stroke="#b8442c" stroke-width="2" stroke-linecap="round" />
    
    <!-- Inner Contract Glyph -->
    <g transform="translate(62, 58) scale(1.7)" fill="none" stroke="url(#primaryGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
      <polyline points="14 2 14 8 20 8" />
      <line x1="8" y1="13" x2="16" y2="13" stroke="#e0b259" stroke-width="1.5" />
      <line x1="8" y1="17" x2="13" y2="17" stroke="#3f7a4a" stroke-width="1.5" />
    </g>

    <!-- Lens Handle -->
    <line x1="120" y1="120" x2="148" y2="148" stroke="#b8442c" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Typography & Positioning -->
  <!-- Kicker / Badge -->
  <g transform="translate(290, 116)">
    <rect width="365" height="26" rx="6" fill="#241a18" stroke="#b8442c" stroke-width="1" stroke-opacity="0.5" />
    <text x="14" y="17" font-family="'IBM Plex Mono', 'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#e0694e" letter-spacing="1.5">BGB §§ 305–310 · DETERMINISTIC AUDIT</text>
  </g>

  <!-- Brand Name -->
  <text x="288" y="195" font-family="'Source Serif 4', Georgia, serif" font-size="64" font-weight="600" fill="#f6f3ec" letter-spacing="-1">ClauseLens</text>

  <!-- Tagline -->
  <text x="290" y="240" font-family="'Inter', system-ui, sans-serif" font-size="19" font-weight="400" fill="#c4bcab" letter-spacing="-0.2">
    Autonomous Contract Risk Scanner &amp; AGB-Auditing for B2B &amp; SMBs
  </text>

  <!-- Feature Pills -->
  <g transform="translate(290, 268)" font-family="'IBM Plex Mono', 'JetBrains Mono', monospace" font-size="11">
    <rect x="0" y="0" width="138" height="26" rx="4" fill="#181614" stroke="#38332c" />
    <text x="12" y="17" fill="#8b8375">ZERO-DEPENDENCY</text>

    <rect x="148" y="0" width="128" height="26" rx="4" fill="#181614" stroke="#38332c" />
    <text x="160" y="17" fill="#8b8375">100% AIR-GAPPED</text>

    <rect x="286" y="0" width="124" height="26" rx="4" fill="#181614" stroke="#38332c" />
    <text x="298" y="17" fill="#8b8375">PDF / DOCX / TXT</text>

    <rect x="420" y="0" width="158" height="26" rx="4" fill="#181614" stroke="#38332c" />
    <text x="432" y="17" fill="#3f7a4a">AUDITABLE RULES</text>
  </g>

  <!-- Right Side Decorative Risk Indicator -->
  <g transform="translate(940, 95)" filter="url(#subtleShadow)">
    <rect width="180" height="210" rx="16" fill="#161412" stroke="#2c2722" stroke-width="1.5" />
    <text x="90" y="38" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#8b8375" letter-spacing="1.2" text-anchor="middle">SCORE AUDIT</text>
    <circle cx="90" cy="105" r="48" fill="none" stroke="#26221d" stroke-width="9" />
    <circle cx="90" cy="105" r="48" fill="none" stroke="#b8442c" stroke-width="9" stroke-linecap="round" stroke-dasharray="235 301" transform="rotate(-90 90 105)" />
    <text x="90" y="103" font-family="'IBM Plex Mono', monospace" font-size="28" font-weight="600" fill="#f6f3ec" text-anchor="middle">78</text>
    <text x="90" y="121" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#8b8375" text-anchor="middle">von 100</text>
    <rect x="36" y="165" width="108" height="22" rx="4" fill="#2d1512" stroke="#b8442c" stroke-opacity="0.4" />
    <text x="90" y="180" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="600" fill="#e0694e" letter-spacing="1.5" text-anchor="middle">RISIKO: HOCH</text>
  </g>

  <!-- Outer Precision Border -->
  <rect x="1" y="1" width="1198" height="398" rx="0" fill="none" stroke="#d8d1c0" stroke-width="1" stroke-opacity="0.1" />
</svg>