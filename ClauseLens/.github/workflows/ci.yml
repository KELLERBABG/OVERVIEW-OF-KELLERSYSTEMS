name: CI Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Test Suite (Zero Dependencies)
        run: node --test

      - name: Run Holdout Evaluation Benchmark
        run: node test/holdout/runner.mjs

