[package]
name = "sca-payload"
version = "0.1.0"
edition = "2024"
description = "Taint-coded payload tracking with ed25519 signing chain for cargo integrity"

[dependencies]
sca-types = { path = "../sca-types" }
sca-graph = { path = "../sca-graph" }
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
