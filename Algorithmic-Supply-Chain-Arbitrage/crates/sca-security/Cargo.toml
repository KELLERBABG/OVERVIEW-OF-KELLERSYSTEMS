[package]
name = "sca-security"
version = "0.1.0"
edition = "2024"
description = "Platform security primitives — capability revocation, verified IPC, memory encryption, zero-knowledge auth, panic-zeroing, deterministic builds, temporal isolation"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
thiserror = "2"
lazy_static = "1.4"
