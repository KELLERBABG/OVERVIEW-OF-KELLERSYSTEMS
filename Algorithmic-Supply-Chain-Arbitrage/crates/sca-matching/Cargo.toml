[package]
name = "sca-matching"
version = "0.1.0"
edition = "2024"
description = "Real-time P2P supply-demand matching engine for arbitrage balancing"

[dependencies]
sca-types = { path = "../sca-types" }
sca-graph = { path = "../sca-graph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
