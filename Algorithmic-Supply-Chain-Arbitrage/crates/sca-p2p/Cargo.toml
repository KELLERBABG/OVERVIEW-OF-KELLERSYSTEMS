[package]
name = "sca-p2p"
version = "0.1.0"
edition = "2024"
description = "Ad-hoc P2P freight capacity orchestration layer — peer discovery, capability negotiation, and message passing"

[dependencies]
sca-types = { path = "../sca-types" }
sca-graph = { path = "../sca-graph" }
sca-matching = { path = "../sca-matching" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"