[package]
name = "sca-contracts"
version = "0.1.0"
edition = "2024"
description = "Trustless settlement gate — Solidity-like smart contract logic for automated payment settlement"

[dependencies]
sca-types = { path = "../sca-types" }
sca-graph = { path = "../sca-graph" }
sca-payload = { path = "../sca-payload" }
sca-matching = { path = "../sca-matching" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
hex = "0.4"
sha2 = "0.10"