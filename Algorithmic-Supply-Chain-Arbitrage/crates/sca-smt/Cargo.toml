[package]
name = "sca-smt"
version = "0.1.0"
edition = "2024"
description = "SMT solver integration for path constraint routing, kinetic invariants, and supply chain space exploration"

[dependencies]
sca-types = { path = "../sca-types" }
sca-graph = { path = "../sca-graph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
