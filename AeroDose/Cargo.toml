[package]
name = "smokeshift-tracker"
version = "0.1.0"
edition = "2024"
description = "Occupational PM2.5 shift dose calculation, Sensirion SPS30 calibration, and tamper-evident audit engine"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"

[[bin]]
name = "smokeshift-cli"
path = "src/main.rs"

[lib]
name = "smokeshift"
path = "src/lib.rs"
