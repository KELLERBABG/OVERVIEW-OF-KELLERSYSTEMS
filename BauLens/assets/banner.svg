<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="BauLens — Deterministische DACH-Bauordnungs-Vorprüfung, Keller Systems">
  <defs>
    <linearGradient id="blMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#57cde2" />
      <stop offset="100%" stop-color="#2fb6cf" />
    </linearGradient>
    <linearGradient id="blBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <radialGradient id="blWash" cx="18%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2fb6cf" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#05070c" stop-opacity="0" />
    </radialGradient>
    <pattern id="blGrid" width="88" height="88" patternUnits="userSpaceOnUse">
      <path d="M88 0H0v88" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#blBg)" />
  <rect width="1200" height="400" fill="url(#blGrid)" />
  <rect width="1200" height="400" fill="url(#blWash)" />

  <!-- Product mark, echoing assets/icon.svg at display size -->
  <g transform="translate(96, 116)">
    <rect width="168" height="168" rx="26" fill="#0b0f18" stroke="#26334a" stroke-width="1.5" />
    <g fill="none" stroke="url(#blMark)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(40, 36) scale(3.6)">
      <path d="M3 20V7l9-5 9 5v13H3z" />
      <path d="M3 13h18M12 2v18" stroke-width="1.5" stroke-opacity="0.55" />
      <circle cx="15" cy="15" r="5" fill="#05070c" fill-opacity="0.9" />
      <path d="M13 15l1.6 1.6L18 13" stroke-width="1.8" />
    </g>
  </g>

  <!-- Wordmark -->
  <text x="316" y="196" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="600" letter-spacing="-1.6" fill="#e9edf3">BauLens</text>
  <text x="318" y="245" font-family="\'IBM Plex Mono\', ui-monospace, monospace" font-size="18" font-weight="600" letter-spacing="3.5" fill="#2fb6cf">KELLER SYSTEMS</text>

  <rect x="1" y="1" width="1198" height="398" fill="none" stroke="#26334a" stroke-width="1" />
