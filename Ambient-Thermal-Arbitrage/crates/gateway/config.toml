[system]
unit_id = "nrw-store-001"
loop_interval_sec = 1.0
bundesland = "NW"

[thermal]
r_th = 0.05
c_th = 1000000.0
t_min = -24.0
t_max = -18.0
t_setpoint_normal = -20.0
t_setpoint_min = -24.0
t_setpoint_max = -18.0
rls_ambient_variance_max_k = 3.0
cargo_lag_enabled = true
cargo_r_th = 0.05
cargo_c_th = 400000.0
cargo_t_max = -17.5

[control]
thermal_integral_max = 3600.0
ttf_critical_sec = 900.0
reaction_time_sec = 60.0
droop_gain_k = 1000.0
freq_nominal = 50.0
min_runtime_sec = 900.0
min_off_time_sec = 600.0
grid_balancing_deadband_hz = 0.1
mpc_cheap_threshold_eur_per_mwh = 25.0
vfd_enabled = true
vfd_oil_return_pulse_every_sec = 0.0
vfd_oil_return_pulse_duration_sec = 30.0
vfd_oil_return_pulse_speed = 1.0
mpc_intraday_deviation_threshold_eur_per_mwh = 0.0
dynamic_price_thresholds_enabled = true
dynamic_price_charge_percentile = 0.25
dynamic_price_shed_percentile = 0.75
vfd_kp = 0.08
vfd_ki = 0.005

[logging]
csv_path = "thermal_arbitrage_log.csv"
interval_sec = 5.0

[api]
bind_address = "0.0.0.0:8085"

[sensor]
simulate = true
ambient_temp_c = 25.0
initial_temp_c = -20.0
cooling_power_w = 5000.0
heat_leak_w = 500.0

[building]
name = "Medium Cold Storage NRW"
volume_m3 = 1000.0
surface_area_m2 = 600.0
u_value_w_per_m2k = 0.25
product_mass_kg = 200000.0
product_specific_heat_j_per_kgk = 2000.0
cop = 2.5
installed_cooling_power_w = 50000.0
air_ach_per_hour = 0.5

[security]
api_secret = "change-me-in-production"
auth_enabled = true

[modbus]
enabled = false
protocol = "tcp"
host = "192.168.0.10"
port = 502
baud_rate = 9600
unit_id = 1
poll_interval_sec = 2.0

[modbus.registers]
internal_temp_addr = 0
compressor_cmd_addr = 1
ambient_temp_addr = 2
alarm_addr = 3

[alerts]
enabled = false
webhook_url = "https://hooks.example.com/test"
max_retries = 5
retry_backoff_sec = 2

[ota]
enabled = false
verify_key_hex = ""
check_interval_sec = 3600.0
staging_dir = "ota_staging"

[live_data]
enabled = true
price_refresh_sec = 900.0
weather_refresh_sec = 3600.0
open_meteo_url = "https://api.open-meteo.com/v1/forecast"
latitude = 51.45
longitude = 7.01
entsoe_api_key = ""
price_max_age_hours = 6.0

[watchdog]
enabled = false
device_path = "/dev/watchdog"
ping_interval_sec = 5.0
systemd_notify = true
