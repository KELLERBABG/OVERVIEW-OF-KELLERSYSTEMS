[package]
name = "thermal-arbitrage-mvp"
version = "0.2.0"
edition = "2021"
description = "Ambient Thermal Arbitrage — Production Pilot (Phase 2)"
authors = ["Ambient Thermal Arbitrage"]
default-run = "thermal-arbitrage-mvp"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP / API
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time and UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

# CSV data logging
csv = "1.3"

# HTTP client (for API data fetching + webhooks)
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Error handling
thiserror = "2"

# Configuration
toml = "0.8"

# Metrics / observability
prometheus = "0.13"

# Authentication (HMAC-SHA256 bearer tokens)
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# Firmware signature verification
ring = "0.17"

# Pin protobuf < 2.26 for prometheus 0.13 compatibility
protobuf = "=2.25.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }