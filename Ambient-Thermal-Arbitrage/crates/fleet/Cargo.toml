[package]
name = "thermal-fleet"
version = "2.0.0"
edition = "2021"
description = "Fleet Thermal Arbitrage — Full ATA.canvas implementation (NRW 2025)"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
csv = "1.3"
reqwest = { version = "0.12", features = ["json", "blocking"] }
rand = "0.8"