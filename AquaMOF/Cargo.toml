[package]
name = "aquamof-harvester"
version = "0.1.0"
edition = "2024"
description = "Thermodynamic simulation and sizing engine for passive atmospheric water harvesting panels using MOF-303"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }

[[bin]]
name = "aquamof-cli"
path = "src/main.rs"

[lib]
name = "aquamof"
path = "src/lib.rs"
