version: '3.8'

services:
  terraflux-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terraflux-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:////app/data/fieldsense.db
      # Security-critical values fail closed: the container refuses to start without them.
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set for production}
      - CORS_ORIGINS=${CORS_ORIGINS:-[]}
      - TTN_WEBHOOK_SECRET=${TTN_WEBHOOK_SECRET:?TTN_WEBHOOK_SECRET must be set for production}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET must be set for production}
      - ENFORCE_WEBHOOK_AUTH=true
      # Messaging channels
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_WHATSAPP_FROM=${TWILIO_WHATSAPP_FROM:-whatsapp:+14155238886}
      - TWILIO_ADVISORY_CONTENT_SID=${TWILIO_ADVISORY_CONTENT_SID:-}
      # Agronomy & background services
      - OPEN_METEO_API_KEY=${OPEN_METEO_API_KEY:-}
      - WEATHER_CACHE_TTL_SECONDS=${WEATHER_CACHE_TTL_SECONDS:-14400}
      - AUTO_SCHEDULER_ENABLED=${AUTO_SCHEDULER_ENABLED:-true}
    volumes:
      - terraflux_data:/app/data

volumes:
  terraflux_data:
    driver: local
