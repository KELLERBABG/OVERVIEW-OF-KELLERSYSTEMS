grapevine:
  name: Grapevine (Wine Grapes / Vitis vinifera)
  category: Viticulture
  root_depth_m: 1.2
  depletion_fraction_p: 0.45
  stages:
    initial:
      kc: 0.3
      duration_days: 30
      desc: Bud break to shoot growth
    development:
      kc: 0.6
      duration_days: 40
      desc: Bloom to veraison
