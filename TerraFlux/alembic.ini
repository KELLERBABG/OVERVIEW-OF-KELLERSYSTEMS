# Alembic configuration for TerraFlux (FieldSense Engine).
#
# The database URL is NOT stored here - `migrations/env.py` reads it from the
# application settings (DATABASE_URL environment variable / .env file) so that the
# same migrations run against SQLite and PostgreSQL without edits.
#
# Usage:
#   alembic upgrade head        # apply all pending migrations
#   alembic downgrade -1        # roll back the last migration
#   alembic revision --autogenerate -m "describe the change"
#   alembic check               # fail if the models drifted from the migrations

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
