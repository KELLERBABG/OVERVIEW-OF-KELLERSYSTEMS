[package]
name = "atmospheric-resonance-sim"
version = "0.1.0"
edition = "2021"
description = "MVP — Energy Harvesting via Atmospheric Resonance (pure simulation)"

[lib]
name = "atmospheric_resonance_sim"
path = "src/lib.rs"

[[bench]]
name = "run_simulation"
harness = false

[[bin]]
name = "atmospheric-resonance-sim"
path = "src/main.rs"

[workspace]
members = [".", "simulation_core"]

[dev-dependencies]
criterion = "0.5"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
rand = "0.8"
eh-sim-core = { path = "simulation_core" }
chacha20poly1305 = "0.10"
blake3 = "1"