[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpsynth"
version = "0.2.0"
description = "Differentially Private Synthetic Data Generator with formal privacy guarantees"
readme = "README.md"
license = "LicenseRef-KELLERBABG-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "KELLERBABG" },
]
keywords = [
    "differential-privacy",
    "synthetic-data",
    "dp-gan",
    "privacy",
    "machine-learning",
]
# License is now expressed via PEP 639 `license =` above (SPDX). The legacy
# `License :: Other Proprietary` classifier is intentionally omitted because
# setuptools>=77 forbids mixing SPDX license expressions with the old
# classifier form.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "opacus>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.80.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]
benchmarks = [
    "ucimlrepo>=0.0.3",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/KELLERBABG/DPSynth"
Repository = "https://github.com/KELLERBABG/DPSynth"
Issues = "https://github.com/KELLERBABG/DPSynth/issues"
Changelog = "https://github.com/KELLERBABG/DPSynth/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["dpsynth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=dpsynth"
markers = [
    "e2e: end-to-end tests exercising the public API surface.",
    "fuzz: property-based fuzz tests using Hypothesis.",
]

[tool.hypothesis]
# Default profile for property-based tests in `tests/test_fuzz_*.py`.
# CI activates Hypothesis's built-in `ci` profile via HYPOTHESIS_PROFILE=ci.
max_examples = 200
deadline = 2000
suppress_health_check = ["too_slow", "filter_too_many"]

[tool.coverage.report]
show_missing = true
skip_covered = false
sort = "Cover"

[tool.ruff]
line-length = 100
target-version = "py311"

# Tight select set to keep CI green. We deliberately omit PL/RUF/SIM/C4 for
# v0.2.0 — many of those rules fire on intentional patterns (NaN self-comparison,
# test magic-number thresholds) and are easier to enable in a follow-up PR
# once legacy code is cleaned up.[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: line-too-long (we use black for formatting; ruff shouldn't fight it).
# B008: function-call in default arg (dataclass-heavy code uses this idiom).
# v0.2.0 backlog (revisit in v0.3.0):
#   F841: unused locals — legacy debug instrumentation. Will be cleaned up
#         when the model and data-loading modules are rewritten against the
#         new public API.
#   B007: unused loop-vars — convention is `_`; mechanical to apply per-site.
#   B905: zip() without explicit strict= — tracing back which call sites need
#         the Python-3.10-strict semantics is invasive enough to defer.
ignore = ["E501", "B008", "F841", "B007", "B905"] 

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
