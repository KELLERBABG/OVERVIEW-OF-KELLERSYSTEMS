name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -e ".[dev]"

      - name: Import smoke
        run: |
          python -c "from dpsynth.privacy import PrivacyAccountant, GradientClipper, GaussianNoiseLayer, ExponentialMechanism, PerSampleGradientComputer; from dpsynth.models import CTGAN_DP; from dpsynth.evaluation import UtilityEvaluator, MembershipInferenceAttack, PostProcessingVerifier; print('All imports OK')"

      - name: Unit tests
        # Coverage gate only enforced on Python 3.12 to keep CI fast
        # and avoid matrix-wide failures when a single Python bump
        # doesn't behave identically to the others.
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            python -m pytest tests/ \
              -v --tb=short \
              --cov=dpsynth \
              --cov-report=term-missing \
              --cov-fail-under=95 \
              -m "not e2e and not fuzz"
          else
            python -m pytest tests/ \
              -v --tb=short \
              --cov=dpsynth \
              --cov-report=term-missing \
              -m "not e2e and not fuzz"
          fi

      - name: E2E tests
        run: |
          python -m pytest tests/test_e2e.py \
            -v --tb=short \
            -m e2e \
            --maxfail=1

  fuzz:
    name: Hypothesis fuzz (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -e ".[dev]"

      - name: Run fuzz suite (Hypothesis ci profile)
        run: |
          HYPOTHESIS_PROFILE=ci python -m pytest \
            tests/test_fuzz_accountant.py \
            -v --tb=short \
            -m fuzz \
            --hypothesis-seed=${{ github.run_number }} \
            -p no:cacheprovider

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"

      - name: Ruff (real gate - fails on findings)
        run: |
          ruff check dpsynth/ tests/

      - name: Black (format check; non-fatal)
        run: |
          black --check dpsynth/ tests/ --diff || true

  typecheck:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: mypy
        run: |
          mypy dpsynth/ --ignore-missing-imports || true
