name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"

# Workflow-level permissions are tightened further per-job below.
permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git-based version detection & release notes

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install build toolchain
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install build

      - name: Verify version matches tag
        # Fail fast if pyproject.toml's `version` doesn't match `vX.Y.Z` from the tag.
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml').read())['project']['version'])")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::pyproject.toml version ($PKG_VERSION) does not match tag ($TAG)."
            echo "::error::Update pyproject.toml, regenerate CHANGELOG entry, and re-tag."
            exit 1
          fi
          echo "Tag $TAG matches pyproject.toml version $PKG_VERSION."

      - name: Verify CHANGELOG.md has no release-date placeholders
        # The CHANGELOG template uses `TBD` as a placeholder. Refuse to ship
        # until the maintainer has replaced it with the actual release date.
        shell: bash
        run: |
          if grep -E 'TBD' CHANGELOG.md; then
            echo "::error::CHANGELOG.md still contains 'TBD' placeholders. Replace with the actual release date before tagging."
            exit 1
          fi

      - name: Build sdist + wheel
        run: python -m build

      - name: Inspect built artifacts
        run: |
          ls -la dist/
          python -m pip install twine
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: ${{ contains(github.ref_name, '-') }}  # any pre-release tag: -rc, -beta, -alpha
    runs-on: ubuntu-latest
    # Per-job OIDC permission — minimal blast radius.
    permissions:
      id-token: write  # required for PyPI trusted publishing
    environment:
      name: testpypi
      url: https://test.pypi.org/p/dpsynth
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI via trusted publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          # PEP 740 attestation is generated by default if supported.

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}  # stable tags only
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/dpsynth
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI via trusted publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: GitHub Release
    # Note: depends on `build` alone (not the publish jobs) so a pre-release
    # tag whose PyPI publish was skipped won't deadlock this job.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release (auto-generated notes)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: dpsynth ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.whl

  failure-notify:
    name: Notify on failure
    needs: [build, publish-testpypi, publish-pypi, github-release]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Log failure context
        run: |
          echo "Release pipeline failed for tag $GITHUB_REF_NAME."
          echo "Inspect workflow logs for which step failed."
          echo "If a publish job failed: check trusted-publishing configuration"
          echo "on the corresponding PyPI/TestPyPI project page."
