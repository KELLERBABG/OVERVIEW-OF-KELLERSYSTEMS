[package]
name = "mesh-api-server"
version = "0.1.0"
license = "proprietary"
edition = "2021"
publish = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
chrono = "0.4"
mesh-graph-core = { path = "../graph-core" }
mesh-wot = { path = "../wot" }
mesh-reputation = { path = "../reputation" }
mesh-credit = { path = "../credit" }
