[workspace]
members = [
    "core/genome-core",
    "core/genome-parser",
    "core/genome-normalizer",
    "core/genome-reference",
    "core/genome-compress",
    "core/genome-annotate",
    "core/genome-ingestion",
    "core/genome-dtc-import",
    "core/query-engine",
    "core/entropy-auditor",
    "core/storage-traits",
    "core/zk-core",
    "mobile/native",
    "api",
    "tools/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha"
edition = "2021"
license = "MIT"
repository = "https://github.com/zeroknowledgegenome/zk-genome"

[workspace.lints]
rust.missing_docs = "warn"
rust.unsafe_code = "forbid"
clippy.pedantic = { level = "warn", priority = -1 }
clippy.nursery = { level = "warn", priority = -1 }
clippy.module_name_repetitions = "allow"
clippy.missing_errors_doc = "allow"
clippy.missing_panics_doc = "allow"
clippy.must_use_candidate = "allow"
clippy.redundant_pub_crate = "allow"
clippy.option_if_let_else = "allow"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
