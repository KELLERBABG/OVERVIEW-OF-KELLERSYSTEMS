[package]
name = "zk-genome-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zero-Knowledge Genome API server — Axum-based REST API for pharma queries"

[dependencies]
zk-genome-zk-core = { path = "../core/zk-core" }
zk-genome-genome-core = { path = "../core/genome-core" }
zk-genome-entropy-auditor = { path = "../core/entropy-auditor" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha3 = "0.10"
async-trait = "0.1"

[lints]
workspace = true