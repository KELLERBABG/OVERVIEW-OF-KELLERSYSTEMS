<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="amb" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="#030712"/>
  <rect width="1200" height="400" fill="url(#amb)"/>
  
  <!-- Circuit Grid Background -->
  <g stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Large Faded Icon Graphic on the Right -->
  <g transform="translate(820, 60) scale(11.5)" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3.5c-.5-.5-2.5 0-4 1.5L13.5 8.5 5.3 6.7c-.8-.2-1.6.1-2.1.7l-.7.7 5.7 3.6-3 3-2.1-.7-.7.7 2.1 2.1 2.1 2.1.7-.7-.7-2.1 3-3 3.6 5.7.7-.7c.6-.5.9-1.3.7-2.1z" />
  </g>

  <!-- Icon Box -->
  <g transform="translate(100, 120)">
    <rect width="160" height="160" rx="36" fill="#060d1a" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>
    <g transform="translate(40, 40) scale(3.33)" fill="none" stroke="url(#bgrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3.5c-.5-.5-2.5 0-4 1.5L13.5 8.5 5.3 6.7c-.8-.2-1.6.1-2.1.7l-.7.7 5.7 3.6-3 3-2.1-.7-.7.7 2.1 2.1 2.1 2.1.7-.7-.7-2.1 3-3 3.6 5.7.7-.7c.6-.5.9-1.3.7-2.1z" />
    </g>
  </g>

  <!-- Title & Subtitle Typography -->
  <text x="300" y="195" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="56" font-weight="700" fill="#f8fafc" letter-spacing="-1">PlaneOS</text>
  <text x="300" y="245" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="600" fill="#38bdf8" letter-spacing="3.5">KELLER SYSTEMS</text>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="1198" height="398" rx="0" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2"/>
</svg>