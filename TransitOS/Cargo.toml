[workspace]
resolver = "2"
members = [
    "crates/state-machine",
    "crates/abstract-interpretation",
    "crates/dynamics-simulator",
    "crates/gas-brake-analysis",
    "crates/path-constraints",
    "crates/state-space",
    "crates/smt-solver",
    "crates/verification-invariants",
    "crates/taint-analysis",
    "crates/spec-generator",
    "crates/deployment-gate",
    "crates/ros2-integration",
    "crates/carla-integration",
    "crates/real-time",
    "crates/monitoring",
    "crates/integration-tests",
    "crates/can-bus",
    "crates/hal",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
approx = "0.5"
