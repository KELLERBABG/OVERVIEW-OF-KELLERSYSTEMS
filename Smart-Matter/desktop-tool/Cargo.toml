[package]
name = "smart-matter-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop configuration and monitoring application for Smart Matter"

[dependencies]
smart-matter-core = { path = "../firmware/core" }
smart-matter-mesh = { path = "../mesh" }
smart-matter-storage = { path = "../storage" }
smart-matter-broadcaster = { path = "../broadcaster" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"