name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: smart-matter-linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: smart-matter-linux-aarch64
          - os: windows-latest
            artifact: smart-matter-windows-x86_64
          - os: macos-13
            artifact: smart-matter-macos-x86_64
          - os: macos-14
            artifact: smart-matter-macos-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
      - name: Build release binaries (native)
        run: cargo build --release --bin smart-matter-desktop --bin smart-matter-flasher --bin smart-matter-network-simulator
      - name: Package artifacts
        shell: bash
        run: |
          EXE=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXE=".exe"; fi
          mkdir -p dist
          cp target/release/smart-matter-desktop$EXE    dist/
          cp target/release/smart-matter-flasher$EXE    dist/
          cp target/release/smart-matter-network-simulator$EXE dist/
          cp LICENSE dist/ 2>/dev/null || true
          if [ "${{ runner.os }}" = "Windows" ]; then
            cd dist && zip -r ../${{ matrix.artifact }}.zip . && cd ..
          else
            tar -C dist -czf ${{ matrix.artifact }}.tar.gz .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    name: Attach binaries to GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
