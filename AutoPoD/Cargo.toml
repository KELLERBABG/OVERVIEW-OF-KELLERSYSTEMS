[workspace]
resolver = "2"
members = [
    "crates/pod-core",
    "crates/telemetry-graph",
    "crates/physics-logic",
    "crates/sensor-integrity",
    "crates/incident-audit",
    "crates/privacy",
    "crates/settlement",
    "crates/pod-cli",
    "crates/pod-dashboard",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
pod-core = { path = "crates/pod-core" }
telemetry-graph = { path = "crates/telemetry-graph" }
physics-logic = { path = "crates/physics-logic" }
sensor-integrity = { path = "crates/sensor-integrity" }
incident-audit = { path = "crates/incident-audit" }
privacy = { path = "crates/privacy" }
settlement = { path = "crates/settlement" }
pod-dashboard = { path = "crates/pod-dashboard" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
ed25519-dalek = "2"
rand = "0.8"
petgraph = "0.7"
clap = { version = "4", features = ["derive"] }
csv = "1.3"
hex = "0.4"
sha2 = "0.10"
proptest = "1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
